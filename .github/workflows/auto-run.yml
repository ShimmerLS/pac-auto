name: Auto Convert Rules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 👉 在这里新增一步：安装 requests 库
      - name: Install dependencies
        run: pip install requests

      - name: Run conversion script
        run: python convert.py  # 注意：如果你把脚本命名为了 update.py，这里就要写 update.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add white-list.sorl white-mini.sorl
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update rules: $(date +'%Y-%m-%d')" && git push)
